# The board, for the sign-in proxy only.
apiVersion: v1
kind: Service
metadata:
  name: trellis
spec:
  selector:
    app: trellis
  ports:
    - name: http
      port: 80
      targetPort: session
---
# The machine door: bearer tokens only, never identity headers. The probes
# need no token; the judge, POST /v1/judge, takes a caller's. Let the
# estate's network policy admit the callers config.yaml names.
apiVersion: v1
kind: Service
metadata:
  name: trellis-machine
spec:
  selector:
    app: trellis
  ports:
    - name: http
      port: 8081
      targetPort: machine
