# The board. It reads config.yaml from the ConfigMap trellis-config, the
# estate's packs from trellis-packs, and its secrets from the Secret
# trellis-secrets, whose keys the config names as ${NAME}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trellis
  labels:
    app: trellis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trellis
  template:
    metadata:
      labels:
        app: trellis
    spec:
      serviceAccountName: trellis
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trellis
          image: ghcr.io/orchard-suite/trellis
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - { containerPort: 8080, name: session }
            - { containerPort: 8081, name: machine }
          env:
            - { name: TRELLIS_CONFIG, value: /etc/trellis/config/config.yaml }
            - { name: TUF_ROOT, value: /tuf }
            - { name: HOME, value: /tuf }
          envFrom:
            - secretRef:
                name: trellis-secrets
                optional: true
          volumeMounts:
            - { name: config, mountPath: /etc/trellis/config, readOnly: true }
            - { name: packs, mountPath: /etc/trellis/packs, readOnly: true }
            - { name: tuf, mountPath: /tuf }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: machine }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: machine }
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: trellis-config }
        - name: packs
          configMap: { name: trellis-packs }
        - name: tuf
          emptyDir: { sizeLimit: 64Mi }
