name: Test

on:
  pull_request:
  # The release calls this first, so a push to main runs it once.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The history tests need an empty database they may own.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis
          POSTGRES_DB: trellis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trellis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRELLIS_TEST_POSTGRES: postgres://trellis:trellis@localhost:5432/trellis?sslmode=disable
    steps:
      # The whole history: check compares definitions with the latest release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
